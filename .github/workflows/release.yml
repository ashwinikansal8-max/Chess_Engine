name: Platform builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Build Linux or macOS portable application
        if: matrix.platform != 'windows'
        run: sh scripts/package-unix.sh
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: chess-engine-${{ matrix.platform }}
          path: target/installer/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform != 'windows'
        with:
          name: chess-engine-${{ matrix.platform }}
          path: target/Chess-Engine-*.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/Chess-Engine-*.zip
            release-assets/Chess*Engine-*.msi
